<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Esan's Withdraw</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#e8edf2;--ink:#14213d;--muted:#5b6678;--card:#fff;--line:#c9d2dc;--acc:#2f4bff;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--ink:#e8edf6;--muted:#93a0b5;--card:#182236;--line:#2a3a56;--acc:#7b8cff;--accink:#0f1624}}
:root[data-theme="dark"]{--bg:#0f1624;--ink:#e8edf6;--muted:#93a0b5;--card:#182236;--line:#2a3a56;--acc:#7b8cff;--accink:#0f1624}
*{box-sizing:border-box}
html,body{margin:0}
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:48px 20px 64px}
h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.05;margin:0 0 12px;font-weight:700;letter-spacing:-.02em}
.bio{color:var(--muted);max-width:46ch;margin:0 0 40px;font-size:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{font:inherit;font-weight:500;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px 8px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab svg{width:22px;height:22px;flex:none}
.tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.tab:focus-visible,.copy:focus-visible,.addr:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.addr{display:block;width:100%;text-align:left;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;
font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;font-size:clamp(1.05rem,4.6vw,1.7rem);line-height:1.45;word-break:break-all}
.row{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:24px}
.copy{font:inherit;font-weight:700;background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
.copy.done{background:#1a9b57;color:#fff}
#qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
.hint{color:var(--muted);font-size:.9rem;margin:20px 0 0}
.admin{margin-top:28px}
.admin h2{font-size:1.15rem;margin:0 0 4px}
.admin p{margin:0 0 14px;color:var(--muted);font-size:.95rem}
.links{display:grid;gap:10px}
.link{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700}
.link:hover{border-color:var(--acc)}
.link:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.link svg{width:30px;height:30px;flex:none}
.link small{display:block;color:var(--muted);font-weight:500;font-size:.88rem}
.toast{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast-box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 40px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25);transform:scale(.85);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.toast.show .toast-box{transform:scale(1)}
.toast svg{width:72px;height:72px;display:block;margin:0 auto 10px}
.toast circle{fill:none;stroke:#1a9b57;stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151}
.toast path{fill:none;stroke:#1a9b57;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
.toast.show circle{animation:draw .45s ease forwards}
.toast.show path{animation:draw .3s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.toast p{margin:0;font-weight:700}
@media (prefers-reduced-motion:reduce){.toast,.toast-box{transition:none}.toast.show circle,.toast.show path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// Replace with your real addresses. Add or remove entries freely.
var ICON_TRON = '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><circle fill="#EF0027" cx="16" cy="16" r="16"/><path d="M21.932 9.913L7.5 7.257l7.595 19.112 10.583-12.894-3.746-3.562zm-.232 1.17l2.208 2.099-6.038 1.093 3.83-3.192zm-5.142 2.973l-6.364-5.278 10.402 1.914-4.038 3.364zm-.453.934l-1.038 8.58L9.472 9.487l6.633 5.502zm.96.455l6.687-1.21-7.67 9.343.983-8.133z" fill="#FFF"/></g></svg>';
var ICON_BNB = '<svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none"><circle cx="16" cy="16" r="16" fill="#F3BA2F"/><path fill="#FFF" d="M12.116 14.404L16 10.52l3.886 3.886 2.26-2.26L16 6l-6.144 6.144 2.26 2.26zM6 16l2.26-2.26L10.52 16l-2.26 2.26L6 16zm6.116 1.596L16 21.48l3.886-3.886 2.26 2.259L16 26l-6.144-6.144-.003-.003 2.263-2.257zM21.48 16l2.26-2.26L26 16l-2.26 2.26L21.48 16zm-3.188-.002h.002V16L16 18.294l-2.291-2.29-.004-.004.004-.003.401-.402.195-.195L16 13.706l2.293 2.293z"/></g></svg>';
var WALLETS = [
  {name:"USDT (TRC20)", icon:ICON_TRON, note:"Send USDT on the TRON (TRC20) network only.", address:"TL79RUGhAnYPPmBGc8eHUU1qzAaGmDE9on"},
  {name:"Binance (BEP20)", icon:ICON_BNB, note:"Send on the BNB Smart Chain (BEP20) network only.", address:"0x94997e0c88c6021ef03ea5299862da73aafba1d3"}
];
var cur = 0, qr = null;
var tabs = document.getElementById("tabs"), addr = document.getElementById("addr"),
    copyBtn = document.getElementById("copy"), hint = document.getElementById("hint"),
    qrBox = document.getElementById("qr");

function render(){
  var w = WALLETS[cur];
  addr.textContent = w.address;
  hint.textContent = w.note;
  Array.prototype.forEach.call(tabs.children, function(b,i){ b.setAttribute("aria-pressed", i===cur ? "true" : "false"); });
  qrBox.innerHTML = "";
  try { qr = new QRCode(qrBox, {text:w.address, width:112, height:112}); } catch(e){ qrBox.style.display="none"; }
}
WALLETS.forEach(function(w,i){
  var b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.innerHTML = w.icon + "<span></span>"; b.lastChild.textContent = w.name;
  b.onclick = function(){ cur = i; render(); };
  tabs.appendChild(b);
});
var toast = document.getElementById("toast"), toastTimer = null;
function showToast(){
  toast.classList.remove("show"); void toast.offsetWidth; toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 1500);
}
function doCopy(){
  var t = WALLETS[cur].address;
  function ok(){ showToast(); copyBtn.textContent = "Copied"; copyBtn.classList.add("done");
    setTimeout(function(){ copyBtn.textContent = "Copy address"; copyBtn.classList.remove("done"); }, 1800); }
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;-webkit-user-select:text;user-select:text";
    document.body.appendChild(ta); ta.select();
    try { if (document.execCommand("copy")) ok(); } catch(e){}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fallback);
  else fallback();
}
copyBtn.onclick = doCopy; addr.onclick = doCopy;

// block zoom (pinch, ctrl+wheel, ctrl +/-/0)
["gesturestart","gesturechange","gestureend"].forEach(function(e){ document.addEventListener(e, function(ev){ ev.preventDefault(); }); });
document.addEventListener("touchmove", function(e){ if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
document.addEventListener("wheel", function(e){ if (e.ctrlKey) e.preventDefault(); }, {passive:false});
document.addEventListener("keydown", function(e){ if ((e.ctrlKey || e.metaKey) && ["+","-","=","0"].indexOf(e.key) > -1) e.preventDefault(); });

render();
</script>
